name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: make check
        run: make check

  test:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        working-directory: backend
        run: cargo test --bin lyra_backend

  test-postgres:
    name: backend tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lyra
          POSTGRES_PASSWORD: lyra
          POSTGRES_DB: lyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LYRA_TEST_DATABASE_URL: postgres://lyra:lyra@localhost:5432/lyra_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test (ignored postgres tests)
        working-directory: backend
        # Scoped to storage:: — the only module with #[ignore = "needs
        # postgres"] tests. Blanket --ignored also sweeps kv::redis's live
        # Redis roundtrip, which has no service container here.
        run: cargo test --bin lyra_backend -- storage:: --ignored
