name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: make check
        run: make check

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: frontend tests (vitest)
        working-directory: frontend
        run: npm test

      - name: backend tests (sqlite)
        working-directory: backend
        run: cargo test --bin lyra_backend

  test-postgres:
    name: backend tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lyra
          POSTGRES_PASSWORD: lyra
          POSTGRES_DB: lyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LYRA_TEST_DATABASE_URL: postgres://lyra:lyra@localhost:5432/lyra_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test (ignored postgres tests)
        working-directory: backend
        # Every SQL-bearing seam module ships a `mod postgres_live` with
        # #[ignore = "needs postgres"] roundtrips — SQLite's loose typing
        # must never green-light SQL PostgreSQL refuses to prepare. The
        # name filter catches them all (including storage::). Blanket
        # --ignored also sweeps kv::redis's live Redis roundtrip, which has
        # no service container here.
        run: "cargo test --bin lyra_backend -- postgres_live --ignored"

  test-mysql:
    name: backend tests (mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_USER: lyra
          MYSQL_PASSWORD: lyra
          MYSQL_DATABASE: lyra_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -plyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LYRA_TEST_MYSQL_URL: mysql://lyra:lyra@localhost:3306/lyra_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test (ignored mysql tests)
        working-directory: backend
        # Mirrors the postgres job: the mysql_live family (migrations,
        # message upsert, spam, pim seams) runs against the service
        # container. MySQL is the third dialect — its loose spots (CAST AS
        # CHAR, ON DUPLICATE KEY, FULLTEXT) differ from both others.
        run: "cargo test --bin lyra_backend -- mysql_live --ignored"
