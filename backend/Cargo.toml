[package]
name = "lyra_backend"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; let-chains (used in if/while) need 1.88.
# sea-orm 2.0 (sqlx 0.9) requires 1.94.
rust-version = "1.94"

[features]
# Backend choice is a deploy-time DATABASE_URL decision; both drivers compile
# by default so a single binary serves either database.
default = ["sqlite", "postgres"]
sqlite = []
postgres = []

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
# Raw sqlx stays for the migration runner, FTS, and raw statements; version
# must match the one sea-orm pairs with (2.0 → sqlx 0.9).
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "postgres",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }
sea-orm = { version = "2.0", features = [
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
    "sqlx-sqlite",
    "sqlx-postgres",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
base32 = "0.5"
aes-gcm = "0.10"
zeroize = "1"
base64 = "0.22"
hkdf = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
# JMAP protocol client (RFC 8620/8621). Pulls reqwest 0.13 alongside our 0.12
# (separate 0.x majors coexist); websockets off — push uses its EventSource stream.
jmap-client = { version = "0.4.2", default-features = false, features = ["async", "aws_lc_rs"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
imap-proto = "0.16"
futures-util = "0.3"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"], default-features = false }
async-trait = "0.1"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
ammonia = "4.1.4"
toml = "0.8"
# full_encoding: legacy/CJK charsets (GBK, GB18030, Big5, EUC-KR, …) via
# encoding_rs — without it mail-parser silently falls back to UTF-8 lossy and
# bakes U+FFFD mojibake into stored subjects and bodies.
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
encoding_rs = "0.8"
regex = "1"
hmac = "0.12"
utf7-imap = "0.3.2"
pgp = "0.19"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints.clippy]
# Clippy warnings as errors (matches Makefile: -D warnings)
all = "warn"
pedantic = "warn"
