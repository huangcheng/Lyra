services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  lyra:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # DaoCloud mirror — Docker Hub auth times out on some networks.
        REGISTRY: docker.m.daocloud.io/library/
    # Bind loopback IPv4 only. On macOS + OrbStack/Docker Desktop, `0.0.0.0:3000`
    # also opens `[::1]:3000`, which resets connections — breaking OAuth callbacks
    # that must use `http://localhost` (Microsoft Entra rejects `127.0.0.1`).
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      LISTEN_ADDR: 0.0.0.0:3000
      DATABASE_URL: sqlite:/data/lyra.db
      DATA_DIR: /data
      RUST_LOG: info
      REDIS_URL: redis://redis:6379
      # Required secret — set it in .env (see .env.example). Compose
      # refuses to start while it is unset.
      LYRA_MASTER_KEY: ${LYRA_MASTER_KEY:?set LYRA_MASTER_KEY in .env (openssl rand -base64 32)}
      LYRA_PUBLIC_URL: ${LYRA_PUBLIC_URL:?set LYRA_PUBLIC_URL in .env (e.g. http://localhost:3000)}
      LYRA_OAUTH_CONFIG: /config/oauth-providers.toml
      # Optional — enables Settings → Sign in with Microsoft (Outlook / M365).
      LYRA_MS_OAUTH_CLIENT_ID: ${LYRA_MS_OAUTH_CLIENT_ID:-}
      LYRA_MS_OAUTH_CLIENT_SECRET: ${LYRA_MS_OAUTH_CLIENT_SECRET:-}
      LYRA_MS_OAUTH_TENANT: ${LYRA_MS_OAUTH_TENANT:-common}
      # Optional — enables Settings → Sign in with Yandex.
      LYRA_YANDEX_OAUTH_CLIENT_ID: ${LYRA_YANDEX_OAUTH_CLIENT_ID:-}
      LYRA_YANDEX_OAUTH_CLIENT_SECRET: ${LYRA_YANDEX_OAUTH_CLIENT_SECRET:-}
    volumes:
      - lyra-data:/data
      - ./config/oauth-providers.toml:/config/oauth-providers.toml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Optional PostgreSQL — switch lyra.DATABASE_URL to:
  # postgres://lyra:lyra@postgres:5432/lyra
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: lyra
  #     POSTGRES_PASSWORD: lyra
  #     POSTGRES_DB: lyra
  #   volumes:
  #     - lyra-pg:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  lyra-data:
  # lyra-pg:
